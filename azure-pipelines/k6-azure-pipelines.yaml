trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  # Set these in Azure DevOps Pipeline variables or variable groups.
  BASE_URL: 'https://automotive-quarkus-rz01.azurewebsites.net/'
  BASIC_AUTH_USER: 'admin'
  VUS: '25'
  RAMP_UP: '1m'
  STEADY_STATE: '5m'
  RAMP_DOWN: '1m'

steps:
  - checkout: self

  - script: mkdir -p k6/results
    displayName: Prepare k6 output folder

  - script: |
      docker run --rm \
        -e BASE_URL="$(BASE_URL)" \
        -e BASIC_AUTH_USER="$(BASIC_AUTH_USER)" \
        -e BASIC_AUTH_PASSWORD="$(BASIC_AUTH_PASSWORD)" \
        -e VUS="$(VUS)" \
        -e RAMP_UP="$(RAMP_UP)" \
        -e STEADY_STATE="$(STEADY_STATE)" \
        -e RAMP_DOWN="$(RAMP_DOWN)" \
        -v "$(System.DefaultWorkingDirectory):/work" \
        -w /work \
        grafana/k6:latest run k6/automotive-api-smoke.js
    displayName: Run k6 performance test
    env:
      BASIC_AUTH_PASSWORD: $(BASIC_AUTH_PASSWORD)

  - publish: $(System.DefaultWorkingDirectory)/k6/results
    artifact: k6-results
    condition: succeededOrFailed()
